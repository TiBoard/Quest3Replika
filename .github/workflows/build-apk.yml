name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer le keystore de signature
        env:
          KEYSTORE_B64: ${{ secrets.QR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "QR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore release configuré."
          else
            echo "Secret QR_KEYSTORE_BASE64 absent : APK signé avec keystore/debug.keystore (signature stable)."
          fi

      - name: Compiler les APK
        env:
          QR_KEYSTORE_PASSWORD: ${{ secrets.QR_KEYSTORE_PASSWORD }}
          QR_KEY_ALIAS: ${{ secrets.QR_KEY_ALIAS }}
          QR_KEY_PASSWORD: ${{ secrets.QR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "dist/Quest3Replika-${VERSION}-${GITHUB_SHA::7}.apk"
          ls -la dist

      # L'artefact est un bonus : le quota de stockage d'artefacts du compte peut être atteint,
      # l'APK reste alors disponible dans les Releases (qui ne comptent pas dans ce quota).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Quest3Replika-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publier la release « latest » (branche main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dernière version (main)" \
            --notes "APK universel compilé automatiquement depuis le commit ${GITHUB_SHA::7}. Installer avec : adb install -r <fichier>.apk"

      - name: Publier la préversion de la PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TAG="pr-${PR_NUMBER}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/*.apk \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "Préversion PR #${PR_NUMBER}" \
            --notes "APK de test compilé depuis la PR #${PR_NUMBER} (commit ${HEAD_SHA::7}). Supprimée automatiquement à la fermeture de la PR."

      - name: Publier la release du tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Quest3Replika $GITHUB_REF_NAME" --generate-notes
